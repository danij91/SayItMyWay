</div><a id="table-edit" data-i18n-title="edit_table_2" data-i18n-aria-label="edit_table_2" hidden target="_blank" rel="noopener">✎</a></div>

<button id="collection-watch" class="primary" hidden="" data-i18n="collection_complete">✓ 수집 완료</button>
<button id="collection-retry" hidden="" data-i18n="retry_saving">저장 재시도</button>
