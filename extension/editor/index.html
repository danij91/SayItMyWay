<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title data-brand-title data-i18n="text_replacement_tables">SayItMyWay · 텍스트 교체 테이블</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../ai-request.css"><script src="../locales/ko.js"></script><script src="../locales/en.js"></script><script src="../locales/ja.js"></script><script src="../locales/zh-Hans.js"></script><script src="../locales/zh-Hant.js"></script><script src="../locales/es.js"></script><script src="../locales/fr.js"></script><script src="../locales/de.js"></script><script src="../locales/pt-BR.js"></script><script src="../locales/ru.js"></script><script src="../locales/id.js"></script><script src="../locales/vi.js"></script><script src="../locales/th.js"></script><script src="../locales/hi.js"></script><script src="../locales/ar.js"></script><script src="../i18n.js"></script></head>
<body><header><h1 data-i18n="table_2">테이블</h1><details id="editor-language" class="editor-language"><summary data-i18n-title="app_language" data-i18n-aria-label="app_language"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="12" rx="4" ry="9"></ellipse><path d="M3 12h18"></path></svg></summary><label class="locale-choice" data-locale-chooser><span data-i18n="app_language">앱 언어</span><select id="app-locale" aria-label="App language" data-i18n-aria-label="app_language"><option value="ko">한국어</option><option value="en">English</option></select></label></details></header>
<main><div class="toolbar save-actions"><button id="save-all" disabled="" data-i18n="save_changes">저장</button><span id="save-state" role="status" data-i18n="loading">불러오는 중…</span></div><section aria-label="테이블 관리" data-i18n-aria-label="table_management"><div class="toolbar file-actions"><button id="import-open" data-i18n="import_file">↥ 가져오기</button><button id="export-current" data-i18n="export_current_table">↧ 내보내기</button></div><div class="toolbar table-actions">
<label><span data-i18n="table_2">테이블</span><select id="table-select" dir="auto"></select></label>
<button id="table-rename" class="icon-button" title="테이블 이름 변경" aria-label="테이블 이름 변경" data-i18n-title="rename_table" data-i18n-aria-label="rename_table">✎</button>
<button id="table-delete" class="icon-button" title="테이블 삭제" aria-label="테이블 삭제" data-i18n-title="delete_table" data-i18n-aria-label="delete_table"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"></path></svg></button>
<button id="table-create" class="icon-button" title="새 테이블" aria-label="새 테이블" data-i18n-title="new_table" data-i18n-aria-label="new_table">＋</button>
<button id="table-copy" class="icon-button" title="테이블 복사" aria-label="테이블 복사" data-i18n-title="copy_table" data-i18n-aria-label="copy_table"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="1.5"></rect><path d="M16 8V3H3v13h5"></path></svg></button>
<button id="ai-request" title="AI 작업 요청" aria-label="AI 작업 요청" data-i18n="ai_task_request_3" data-i18n-title="ai_task_request" data-i18n-aria-label="ai_task_request">✦ AI 요청</button>
</div></section>
<dialog id="table-editor"><form id="table-form"><h2 data-i18n="table_name">테이블 이름</h2><label><span data-i18n="name">이름</span><input dir="auto" id="table-name" required="" maxlength="200"></label><p id="table-error" role="alert"></p><button type="button" id="table-cancel" data-i18n="cancel">취소</button><button type="submit" data-i18n="apply_to_draft">확인</button></form></dialog>
<p id="counts"></p><div class="toolbar filters"><label><span data-i18n="search">검색</span><input dir="auto" id="query" type="search" placeholder="원문 또는 대체문" data-i18n-placeholder="original_or_replacement_text"></label><label><span data-i18n="status">상태</span><select id="status"><option value="" data-i18n="all">전체</option><option value="untranslated" data-i18n="untranslated">미작성</option><option value="review" data-i18n="in_review">검토 중</option><option value="verified" data-i18n="verified">확인 완료</option></select></label>
</div>
<p id="message" role="status"></p><button id="load-retry" hidden="" data-i18n="reload">다시 불러오기</button><div class="toolbar row-actions"><button id="add" title="항목 추가" aria-label="항목 추가" data-i18n="add_entry_2" data-i18n-title="add_entry" data-i18n-aria-label="add_entry">＋ 항목 추가</button></div><div class="table-wrap"><table><thead><tr><th data-i18n="original_text">원문</th><th data-i18n="replacement_text">바꿀 텍스트</th><th data-i18n="status">상태</th><th data-i18n="edit">편집</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="hint" data-i18n="change_site_table_associations_in_the_extension_popups">사이트의 테이블 연결은 확장 팝업의 적용 사이트 목록에서 변경합니다.</p>
<dialog id="editor"><form id="form"><h2 id="edit-title" data-i18n="edit_entry">항목 편집</h2><div class="fields">
<label><span data-i18n="original_text">원문</span><textarea dir="auto" name="en" required=""></textarea></label><label><span data-i18n="replacement_text">바꿀 텍스트</span><textarea dir="auto" name="ko"></textarea></label>
<label><span data-i18n="status">상태</span><select name="status"><option value="untranslated" data-i18n="untranslated">미작성</option><option value="review" data-i18n="in_review">검토 중</option><option value="verified" data-i18n="verified">확인 완료</option></select></label></div>
<details id="entry-details"><summary data-i18n="details_evidence_matching">상세 설정</summary><div class="fields">

<label><span data-i18n="kind">종류</span><select name="kind"><option value="general" data-i18n="general">일반</option><option value="game" data-i18n="game_term">게임 용어</option><option value="ui" data-i18n="site_ui">사이트 UI</option></select></label><label><span data-i18n="category">분류</span><input dir="auto" name="category" required="" value="일반"></label>
<label><span data-i18n="context_id">문맥 식별자</span><input dir="ltr" name="context" required="" value="global"></label><label><span data-i18n="scope_css_selector_optional">범위 CSS 선택자 (선택)</span><input dir="ltr" name="selector"></label>
<label><span data-i18n="source_url_ui_reviewer">출처 주소 / UI 검토자</span><input dir="auto" name="source"></label><label><span data-i18n="verification_evidence">확인 근거</span><textarea dir="auto" name="evidence"></textarea></label><label><span data-i18n="notes">메모</span><textarea dir="auto" name="notes"></textarea></label></div>
<p data-i18n="verified_game_terms_need_an_official_source_url">게임 용어의 확인 완료에는 공식 자료 URL 또는 ‘사용자 확인:’으로 시작하는 출처와 확인 근거가 필요합니다.</p></details>
<p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel" data-i18n="cancel">취소</button><button type="submit" id="save" data-i18n="apply_to_draft">확인</button></div></form></dialog>
<dialog id="import-editor" aria-labelledby="import-title"><h2 id="import-title" data-i18n="import_file_2">가져오기</h2>
<p data-i18n="validate_json_and_import_it_as_new_table">JSON을 검사해 새 테이블 초안으로 가져옵니다. 여러 테이블은 각각 가져옵니다.</p>
<div id="import-dropzone"><p data-i18n="drop_one_json_file_here_or_select_it">JSON 파일 하나를 여기에 놓거나 아래에서 선택하세요.</p><label><span data-i18n="json_file_up_to_5mb">JSON 파일 (최대 5MB)</span><input dir="auto" id="import-file" type="file" accept=".json,application/json"></label></div>
<p id="import-summary" role="status"></p><p id="import-error" role="alert"></p><div class="actions"><button id="import-cancel" type="button" data-i18n="close">닫기</button></div></dialog>
</main><script src="../shared.js"></script><script src="../library.js"></script><script src="import.js"></script><script src="../ai-request.js"></script><script src="../ai-request-ui.js"></script><script src="transport.js"></script><script src="app.js"></script>
</body></html>
